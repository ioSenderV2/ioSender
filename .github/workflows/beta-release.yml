name: Beta build (PR)

# Publishes a prerelease "beta-pr<N>" build (Release config zip) for a PR while its "beta" label is
# applied - lets other users download and test a specific PR's build before it merges, without cutting
# a real numbered release (see release.yml for that). Updates the SAME release in place on every push
# to the PR (not a new one each time). Deletes the release + tag when the PR closes/merges OR the
# "beta" label is removed, so the Releases page only ever shows currently-open beta PRs alongside real
# releases - never accumulates stale test builds.
#
# NOTE: pull_request from a FORK does not get repo secrets by default - this only works for PRs from
# branches within this repo, which is the normal case here (see CLAUDE.md's branch model: no outside
# contributor PRs are expected).
#
# To use: apply the "beta" label (create it once in the repo's Labels settings if it doesn't exist) to
# any open PR. Remove the label, or close/merge the PR, to tear the beta build down again.

on:
  pull_request:
    types: [opened, labeled, unlabeled, synchronize, reopened, closed]

jobs:
  publish-beta:
    if: ${{ github.event.action != 'closed' && contains(github.event.pull_request.labels.*.name, 'beta') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build Release
        run: msbuild "ioSender XL\ioSender XL.sln" -restore -t:Build -p:Configuration=Release -m -nologo -v:minimal -clp:ErrorsOnly

      - name: Zip build output
        shell: pwsh
        run: |
          $src = "ioSender XL\ioSender XL\bin\Release"
          Compress-Archive -Path "$src\*" -DestinationPath "ioSender-beta-pr${{ github.event.pull_request.number }}.zip" -Force

      - name: Publish beta-pr${{ github.event.pull_request.number }}
        uses: ncipollo/release-action@v1
        with:
          tag: beta-pr${{ github.event.pull_request.number }}
          name: "ioSender beta - PR #${{ github.event.pull_request.number }} (${{ github.event.pull_request.head.ref }} @ ${{ github.event.pull_request.head.sha }})"
          body: |
            Beta build of PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}

            Branch: `${{ github.event.pull_request.head.ref }}`
            Commit: ${{ github.event.pull_request.head.sha }}

            **Test build only, not a release.** Unzip and run ioSender.exe. This release is replaced on
            every push to the PR and deleted automatically when the PR closes or the "beta" label is
            removed.
          prerelease: true
          makeLatest: false
          allowUpdates: true
          removeArtifacts: true
          artifacts: ioSender-beta-pr${{ github.event.pull_request.number }}.zip
          # Same PAT release.yml uses - default GITHUB_TOKEN can't create releases in this repo (org
          # policy locks default workflow permissions to read-only).
          token: ${{ secrets.RELEASE_TOKEN }}

  cleanup-beta:
    if: ${{ github.event.action == 'closed' || (github.event.action == 'unlabeled' && github.event.label.name == 'beta') }}
    runs-on: ubuntu-latest
    steps:
      - name: Delete beta-pr${{ github.event.pull_request.number }} release + tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          $tag = "beta-pr${{ github.event.pull_request.number }}"
          gh release delete $tag --repo ${{ github.repository }} --yes --cleanup-tag
          if ($LASTEXITCODE -ne 0) {
            Write-Host "No beta release found for $tag - nothing to clean up."
          }
          exit 0
