name: Versioned release

# Builds ioSender XL in Release config and publishes a real versioned GitHub Release
# (2.1, 2.2, ...) on every push to master that adds a new Overview.html changelog
# entry, with notes drawn from the entries new since the previous release. Pushes
# with no new entry (CI/tooling/docs housekeeping - nothing that would produce a
# different .zip worth shipping) are computed but not built or published; no
# version number is consumed. install.ps1 and the in-app Check for Updates both
# pull the actual GitHub "latest release".
#
# After publishing, this workflow also commits Overview.html's TOC "version" stamps
# back to master (tools/cut-release.ps1 fills them in) - guarded with [skip release]
# in that commit's message so it doesn't retrigger itself.
on:
  push:
    branches: [master]
  workflow_dispatch: {}

jobs:
  build-and-publish:
    runs-on: windows-latest
    if: ${{ !contains(github.event.head_commit.message, '[skip release]') }}
    steps:
      # Check out using our own PAT (not the default low-privilege GITHUB_TOKEN) so the
      # credential actions/checkout persists for the whole job - and that every later git
      # push in this job reuses automatically - already has write access. Avoids the fragile
      # dance of manually replacing that persisted credential in a later step (three failed
      # attempts: URL-embedded creds got "Invalid username or token"; "git -c
      # http.extraheader=... push" added a second header instead of replacing one, "Duplicate
      # header: Authorization"; and re-tried as one -c token, which didn't survive PowerShell's
      # native-argument handling for a key this complex and got silently dropped entirely).
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Compute version + changelog delta
        id: relinfo
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: ./tools/cut-release.ps1 -Repo ${{ github.repository }} -Html Overview.html -NotesOut release-notes.md

      - name: Add MSBuild to PATH
        if: ${{ steps.relinfo.outputs.hasChanges == 'true' }}
        uses: microsoft/setup-msbuild@v2

      - name: Embed build commit + version
        if: ${{ steps.relinfo.outputs.hasChanges == 'true' }}
        shell: pwsh
        run: |
          $path = "ioSender XL\ioSender XL\BuildInfo.cs"
          $content = Get-Content $path -Raw
          $content = $content -replace 'CommitSha = "dev"', "CommitSha = `"${{ github.sha }}`""
          $content = $content -replace 'Version = "dev"', 'Version = "${{ steps.relinfo.outputs.version }}"'
          Set-Content $path $content -NoNewline

      - name: Build Release
        if: ${{ steps.relinfo.outputs.hasChanges == 'true' }}
        run: msbuild "ioSender XL\ioSender XL.sln" -restore -t:Build -p:Configuration=Release -m -nologo -v:minimal -clp:ErrorsOnly

      - name: Zip build output
        if: ${{ steps.relinfo.outputs.hasChanges == 'true' }}
        shell: pwsh
        run: |
          $src = "ioSender XL\ioSender XL\bin\Release"
          Compress-Archive -Path "$src\*" -DestinationPath "ioSender.zip" -Force

      - name: Publish release v${{ steps.relinfo.outputs.version }}
        if: ${{ steps.relinfo.outputs.hasChanges == 'true' }}
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ steps.relinfo.outputs.version }}
          name: ioSender ${{ steps.relinfo.outputs.version }}
          bodyFile: ${{ steps.relinfo.outputs.notesFile }}
          makeLatest: true
          prerelease: false
          artifacts: ioSender.zip
          # Default GITHUB_TOKEN can't create releases here - org policy locks
          # default workflow permissions to read-only, and changing it needs
          # org-admin (not available to this repo's maintainer token). Use a
          # PAT stored as a repo secret instead.
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Commit changelog version stamps
        if: ${{ steps.relinfo.outputs.hasChanges == 'true' }}
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Overview.html
          git commit -m "chore: stamp v${{ steps.relinfo.outputs.version }} changelog entries [skip release]"
          git push origin HEAD:master

      # Republish Overview.html to the gh-pages branch, which GitHub Pages serves as a real
      # rendered page at https://<owner>.github.io/<repo>/overview.html - that URL is what the
      # release notes link to (cut-release.ps1). Runs AFTER the stamp commit above so the
      # published copy carries this release's TOC version stamps, not the pre-stamp text.
      #
      # Why this step exists: gh-pages was published by hand once (2026-08-04) and nothing
      # refreshed it, so the served copy drifted ~154KB behind the repo's Overview.html - a
      # reader following the release link would silently get a changelog that didn't contain
      # the entries the release notes had just listed. A link to a stale doc is worse than no
      # link, so this automation is what makes the link honest.
      #
      # DESTINATION FILENAME IS LOWERCASE (overview.html) while the repo file is capitalized.
      # GitHub Pages URLs are case-sensitive even though the Windows runner's filesystem is not
      # - renaming it to Overview.html here would 404 the existing published URL and every link
      # already pointing at it. Do not "fix" the case to match the repo.
      #
      # Overview.html is fully self-contained (inline CSS/JS/SVG, zero <img> or src= refs), so
      # copying the single file is the whole publish - no assets to carry alongside it.
      - name: Publish Overview to GitHub Pages
        if: ${{ steps.relinfo.outputs.hasChanges == 'true' }}
        shell: pwsh
        run: |
          $ghp = Join-Path $env:RUNNER_TEMP 'gh-pages'
          git fetch origin gh-pages --depth=1
          # Detached worktree off origin/gh-pages, kept OUTSIDE the workspace so it can't be
          # swept into a later `git add` in the main checkout.
          git worktree add $ghp origin/gh-pages
          Copy-Item Overview.html -Destination (Join-Path $ghp 'overview.html') -Force
          git -C $ghp add overview.html
          # A release can ship code/version changes without touching Overview.html's body; an
          # unguarded commit would exit 1 on "nothing to commit" and fail an otherwise good
          # release. Only commit when the copy actually changed something.
          git -C $ghp diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "gh-pages overview.html already current - nothing to publish."
          } else {
            git -C $ghp -c user.name="github-actions[bot]" `
                        -c user.email="github-actions[bot]@users.noreply.github.com" `
                        commit -m "docs: publish Overview for v${{ steps.relinfo.outputs.version }}"
            if ($LASTEXITCODE -ne 0) { throw "gh-pages commit failed" }
            git -C $ghp push origin HEAD:gh-pages
            if ($LASTEXITCODE -ne 0) { throw "gh-pages push failed" }
            Write-Host "Published Overview to gh-pages for v${{ steps.relinfo.outputs.version }}."
          }
